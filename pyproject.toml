[project]
name = "sezzle-support-agent"
version = "0.1.0"
description = "LLM-powered Sezzle support assistant -- FastAPI service, stateless FastMCP tool server, LangGraph RAG agent over local Ollama."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.141",
    "uvicorn>=0.52",
    "pydantic>=2.13",
    "pydantic-settings>=2.14",
    "python-dotenv>=1.2",
    "pyjwt>=2.13",
    "httpx>=0.28",
    "fastmcp>=3.4",
    "chromadb>=1.5",
    "langgraph>=1.2",
    "langchain-ollama>=1.1",
    "langchain-mcp-adapters>=0.3",
    "langsmith>=0.10",
]

[tool.uv]
package = false
